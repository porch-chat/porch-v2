name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: porch
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: porch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porch -d porch"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://porch:ci_only@localhost:5432/porch
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p porch-server --locked postgres_migrations -- --ignored
      - run: cargo test -p porch-server --locked --test identity -- --ignored
      - run: cargo build --workspace --locked
      - run: python3 scripts/identity-smoke.py
