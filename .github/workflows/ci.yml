name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**/*.md']
  pull_request:
    paths-ignore: ['docs/**/*.md']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    if: github.event_name != 'pull_request' || github.head_ref != 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: porch
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: porch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porch -d porch"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://porch:ci_only@localhost:5432/porch
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      # Shared disposable database: ignored integration tests run serially.
      - run: cargo nextest run --workspace --locked --run-ignored only --test-threads 1
      - run: cargo test --workspace --locked --doc
      - run: cargo build --workspace --locked
      - run: python3 scripts/identity-smoke.py
