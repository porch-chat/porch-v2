name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**/*.md']
  pull_request:
    paths-ignore: ['docs/**/*.md']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    if: github.event_name != 'pull_request' || github.head_ref != 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: porch
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: porch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porch -d porch"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://porch:ci_only@localhost:5432/porch
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux desktop libraries
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libasound2-dev libglib2.0-dev libfontconfig1-dev libssl-dev libvulkan1 fonts-dejavu-core mesa-vulkan-drivers xvfb openbox xdotool imagemagick ffmpeg
      - name: Native WebRTC clang 21 toolchain
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - name: Bounded trusted FFmpeg fixture diagnostic
        run: python3 scripts/video-fixture-diagnostic.py
      # Shared disposable database: ignored integration tests run serially.
      - run: cargo nextest run --workspace --locked --run-ignored only --test-threads 1
      - run: cargo test --workspace --locked --doc
      - run: cargo build --workspace --locked
      - run: python3 scripts/identity-smoke.py
      - name: Native headless keyboard smoke
        env:
          PGPASSWORD: ci_only
          PORCH_SMOKE_SCREENSHOT: target/native-smoke.png
        run: |
          psql -h localhost -U porch -d postgres -c 'CREATE DATABASE porch_desktop_smoke'
          export DATABASE_URL=postgres://porch:ci_only@localhost:5432/porch_desktop_smoke
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          xvfb-run -a -s '-screen 0 1440x1000x24' python3 scripts/desktop-smoke.py

      - name: Native authenticated media poster smoke
        env:
          PGPASSWORD: ci_only
          PORCH_MEDIA_SCREENSHOT: target/native-media-smoke.png
          PORCH_PREVIEW_CLICK: "440,405"
        run: |
          psql -h localhost -U porch -d postgres -c 'CREATE DATABASE porch_media_smoke'
          export DATABASE_URL=postgres://porch:ci_only@localhost:5432/porch_media_smoke
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          xvfb-run -a -s '-screen 0 1440x1000x24' python3 scripts/desktop-media-smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: porch-linux-x86_64-debug
          path: |
            target/debug/porch-desktop
            target/native-smoke.png
            target/native-media-smoke.png
            assets/brand/fonts/OFL-Manrope.txt
          retention-days: 7
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p porch-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p porch-desktop --locked
      - run: cargo build -p porch-desktop --locked
      - uses: actions/upload-artifact@v4
        with:
          name: porch-windows-x86_64-debug
          path: |
            target/debug/porch-desktop.exe
            assets/brand/fonts/OFL-Manrope.txt
          retention-days: 7

  flutter-desktop:
    name: Flutter ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-bridge
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Linux Flutter build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libpulse-dev
      - working-directory: apps/porch_flutter
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/porch_flutter
        run: flutter analyze
      - working-directory: apps/porch_flutter
        run: flutter test
      - name: Build Linux bundle with Rust bridge
        if: runner.os == 'Linux'
        run: scripts/flutter-build.sh
      - name: Generated Dart native bridge integration
        if: runner.os == 'Linux'
        env:
          DATABASE_URL: postgres://porch:ci_only@127.0.0.1:5432/porch
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE porch WITH LOGIN SUPERUSER PASSWORD 'ci_only'"
          sudo -u postgres createdb -O porch porch
          cargo build -p porch-server -p porch-cli --locked
          python3 scripts/flutter-fixture-proof.py
      - name: Build Windows bundle with Rust bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/flutter-build.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: porch-flutter-linux-x86_64
          path: |
            apps/porch_flutter/build/linux/x64/release/bundle/
            apps/porch_flutter/assets/OFL-Manrope.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: porch-flutter-windows-x86_64
          path: |
            apps/porch_flutter/build/windows/x64/runner/Release/
            apps/porch_flutter/assets/OFL-Manrope.txt
          retention-days: 7

  commet-linux:
    name: Commet fork (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: commet-bridge
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libpulse-dev libsecret-1-dev libmpv-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libnotify-dev libkeybinder-3.0-dev libepoxy-dev
      - name: Build Porch native library
        run: cargo build -p porch-flutter --locked
      - working-directory: apps/porch_commet/commet
        run: |
          flutter pub get
          dart run scripts/codegen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/client/porch
          flutter test unit_test/porch_adapter_test.dart
          CXXFLAGS="-w" CFLAGS="-w" flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: porch-commet-linux-x86_64-debug
          path: |
            apps/porch_commet/commet/build/linux/x64/debug/bundle/
            apps/porch_commet/commet/LICENSE
            apps/porch_commet/NOTICE-COMMET.md
          retention-days: 7

  commet-windows:
    name: Commet fork (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: commet-bridge-win
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Build Porch native library
        run: cargo build -p porch-flutter --locked
      - working-directory: apps/porch_commet/commet
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
          # MSVC link.exe intermittently fails LNK1201 writing rust_lib_commet.pdb; strip=debuginfo makes rustc pass /DEBUG:NONE so no pdb is written
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
          # flutter_inappwebview_windows uses deprecated <experimental/coroutine>; MSVC 14.51 hard-errors without this
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter pub get
          dart run scripts/codegen.dart
          flutter test unit_test/porch_adapter_test.dart
          flutter build windows --release
          if (!(Test-Path build/windows/x64/runner/Release/porch_flutter.dll)) { throw "Porch native DLL missing from bundle" }
          if (!(Test-Path build/windows/x64/runner/Release/commet.exe)) { throw "Commet executable missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: porch-commet-windows-x86_64
          path: |
            apps/porch_commet/commet/build/windows/x64/runner/Release/
            apps/porch_commet/commet/LICENSE
            apps/porch_commet/NOTICE-COMMET.md
          retention-days: 7
