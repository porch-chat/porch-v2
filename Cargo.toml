[workspace]
resolver = "3"
members = ["crates/porch-protocol", "crates/porch-server", "crates/porch-core", "crates/porch-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
porch-protocol = { path = "crates/porch-protocol" }
porch-core = { path = "crates/porch-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["util"] }

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
