[build]
jobs = 2
# Native GPUI has a large dependency graph. Avoid multi-GB DWARF/incremental caches
# in development and hosted CI; release artifacts remain separate.
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false

# LiveKit's prebuilt Windows WebRTC uses the static release CRT. Keep Rust and
# its C++ bridge on the same CRT rather than suppressing linker conflicts.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
